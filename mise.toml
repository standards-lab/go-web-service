# See architecture/standards/go-elemental/principles/release-and-ci.md
# See docs/tasks.md
# See compose/README.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.22.0", version_prefix = "marathon/v" }
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
"aqua:google/go-containerregistry" = "0.22.1"

[env]
APP_ENV = "local"
GO_MODULES = ". tools/slab"

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, sqlint the SQL files, then run lint-context and lint-references; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run --build-tags integration ./...
done
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT"
go tool sqlint
fail=0
for lint in lint-context lint-references; do
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
  elif ! "$lint"; then
    fail=1
  fi
done
exit "$fail"
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, action pin, and image tag behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive and direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

[tasks.vet]
description = "Run go vet, the integration suite and the slab module included"
run = "go vet -tags integration ./... && cd tools/slab && go vet ./..."

[tasks.serve]
description = "Run the service locally, streaming its logs to the observability collector, which `otel:up` must start first"
shell = "bash -c"
run = '''
exec 3>/dev/tcp/127.0.0.1/${OTEL_LOG_PORT:-4319} || exit
exec 4>&1
go run ./cmd/server | tee -i /dev/fd/4 >&3
'''

[tasks.test]
description = "Run the unit tier, the slab module included"
run = "go test -race ./... && cd tools/slab && go test -race ./..."

[tasks.integration]
description = "Start an isolated compose stack on its own ports, run the integration tier against it, print the stack's logs on a failure, and tear it down with its volumes"
run = '''
set -e
export COMPOSE_PROJECT_NAME=go-web-service-integration POSTGRES_PORT=5433 AZURITE_BLOB_PORT=10001 NATS_PORT=4223
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs; docker compose down -v; exit $rc' EXIT
docker compose up -d --wait --build
APP_DATABASE_PORT=5433 APP_STORAGE_ENDPOINT=http://127.0.0.1:10001/devstoreaccount1 APP_NATS_URL=nats://127.0.0.1:4223 go test -race -count=1 -tags integration ./integration/
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint, the integration suite and the slab module included, then sqlint over the SQL files"
run = "golangci-lint run --build-tags integration ./... && go tool sqlint && cd tools/slab && golangci-lint run ./..."

[tasks.slab]
description = "Run slab, the narrated-scenario runner, from its own module (`mise run slab -- scenario <name>`)"
dir = "tools/slab"
run = "go run ./cmd/slab"

[tasks."db:up"]
description = "Build and start the compose PostgreSQL, Azurite, and NATS and wait until they are healthy"
run = "docker compose up -d --wait --build"

[tasks."db:down"]
description = "Stop the compose PostgreSQL, Azurite, and NATS, keeping their volumes"
run = "docker compose down"

[tasks."db:reset"]
description = "Stop the compose PostgreSQL, Azurite, and NATS and drop their volumes"
run = "docker compose down -v"

[tasks."otel:up"]
description = "Build and start the observability profile (collector, Loki, Tempo, Mimir, Grafana), wait for health, and poll Mimir until it answers a query"
run = '''
set -e
docker compose --profile observability up -d --wait --build otel-collector loki tempo mimir grafana
for i in $(seq 1 30); do
  curl -sf "http://127.0.0.1:${MIMIR_PORT:-9009}/prometheus/api/v1/query?query=vector(1)" >/dev/null && exit 0
  sleep 1
done
echo "mimir did not become queryable within 30s" >&2
exit 1
'''

[tasks."otel:down"]
description = "Stop the observability profile (keep data)"
run = "docker compose --profile observability down otel-collector loki tempo mimir grafana"

[tasks."otel:reset"]
description = "Stop the observability profile and drop its data"
run = "docker compose --profile observability down -v otel-collector loki tempo mimir grafana"

[tasks."stack:up"]
description = "Build and start PostgreSQL, Azurite, and NATS and the observability profile and wait for health"
depends = ["db:up", "otel:up"]

[tasks."stack:down"]
description = "Stop PostgreSQL, Azurite, and NATS and the observability profile (keep data)"
depends = ["db:down", "otel:down"]

[tasks."stack:reset"]
description = "Stop PostgreSQL, Azurite, and NATS and the observability profile and drop their data"
depends = ["db:reset", "otel:reset"]

[tasks."db:state"]
description = "Reset the running service's database to a named state through its admin mount: revert every migration set, apply them, and seed the state"
usage = 'arg "<state>" help="The state to reset to, one of GET /admin/database/states"'
run = 'curl -sS --fail-with-body -H "Content-Type: application/json" -d "{\"state\":\"$usage_state\",\"confirm\":true}" http://127.0.0.1:8080/admin/database/state && echo'
