[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
jq = "1.8.2"
"aqua:google/go-containerregistry" = "0.22.1"

[env]
APP_ENV = "local"
# The repository's Go modules, as directories; tasks run in each one. slab is
# its own module under tools/ (see the slab task).
GO_MODULES = ". tools/slab"

# The one check: read-only and deterministic, stopping at the first failure.
# vet, fix, and lint read the integration suite too (-tags integration), as
# the vet and lint tasks do; go test runs the unit tier only, the integration
# tier staying behind its build tag. sqlint then reads the SQL files against
# the base module's requirements.
[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, then sqlint the SQL files; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run --build-tags integration ./...
done
echo "check: sqlint"
cd "$MISE_PROJECT_ROOT"
go tool sqlint
'''

# Currency: report what trails its latest, and the convenience that upgrades it.
[tasks.currency]
description = "Report every requirement, Go version, tool, action pin, and image tag behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive and direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
# The go directive follows the current Go minor, with no toolchain line.
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

[tasks.vet]
description = "Run go vet, the integration suite and the slab module included"
run = "go vet -tags integration ./... && cd tools/slab && go vet ./..."

# Start the observability profile first (`mise run otel:up`): the task opens a
# TCP connection to the collector's log port before it builds anything and
# exits when nothing answers. tee then copies every stdout line to the terminal
# and to that socket. If the collector goes away while the service runs, the
# chain breaks on a later log write and SIGPIPE kills the service, so restart
# the profile only while serve is stopped. The shell is bash, not sh, because
# /dev/tcp is a bash pseudo-device.
#
# Ctrl-C reaches every process in the pipeline at once. The server drains and
# logs "server stopped" a moment later, so tee has to outlive the signal
# (-i ignores it) or that last write hits a dead pipe and SIGPIPE kills the
# server instead. A socket cannot be opened by path, so it takes tee's stdout
# through a dup, and the terminal, saved on fd 4, is the path argument.
[tasks.serve]
description = "Run the service locally, streaming its logs to the observability collector"
shell = "bash -c"
run = '''
exec 3>/dev/tcp/127.0.0.1/${OTEL_LOG_PORT:-4319} || exit
exec 4>&1
go run ./cmd/server | tee -i /dev/fd/4 >&3
'''

[tasks.test]
description = "Run the unit tier, the slab module included"
run = "go test -race ./... && cd tools/slab && go test -race ./..."

# The integration tier runs the same compose definition as its own project on
# its own ports, so the developer's stack and data are never touched, and tears
# it down with its volumes when the suite ends, pass or fail, printing the
# stack's logs first on a failure. CI runs this task as it is.
[tasks.integration]
description = "Start an isolated compose stack, run the integration tier against it, and tear it down"
run = '''
set -e
export COMPOSE_PROJECT_NAME=go-web-service-integration POSTGRES_PORT=5433 AZURITE_BLOB_PORT=10001
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs; docker compose down -v; exit $rc' EXIT
docker compose up -d --wait --build
APP_DATABASE_PORT=5433 APP_STORAGE_ENDPOINT=http://127.0.0.1:10001/devstoreaccount1 go test -race -count=1 -tags integration ./integration/
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint, the integration suite and the slab module included, then sqlint over the SQL files"
run = "golangci-lint run --build-tags integration ./... && go tool sqlint && cd tools/slab && golangci-lint run ./..."

# slab is its own module under tools/ so cobra never enters cmd/server's
# dependency graph. Running from that directory, rather than passing through
# at the root, means a clone without a go.work still resolves slab's
# dependencies against the published releases.
[tasks.slab]
description = "Run slab, the narrated-scenario runner (`mise run slab -- list`)"
dir = "tools/slab"
run = "go run ./cmd/slab"

# The development stacks: compose.yml's PostgreSQL and Azurite (db:) and its
# observability profile (otel:), whose data lives in named volumes that each
# group's down keeps and its reset drops.
[tasks."db:up"]
description = "Build and start the compose PostgreSQL and Azurite and wait until they are healthy"
run = "docker compose up -d --wait --build"

[tasks."db:down"]
description = "Stop the compose PostgreSQL and Azurite, keeping their volumes"
run = "docker compose down"

[tasks."db:reset"]
description = "Stop the compose PostgreSQL and Azurite and drop their volumes"
run = "docker compose down -v"

# `up` always starts the unprofiled services alongside an activated profile,
# so naming the five services here keeps it from also starting postgres.
# Mimir's HTTP endpoint answers ready before its querier ring finishes joining
# (compose/README.md), and its image has no shell for a HEALTHCHECK, so
# --wait alone does not cover it. Poll a synthetic query (no series to read,
# just the query path itself) until it succeeds instead of trusting /ready.
[tasks."otel:up"]
description = "Build and start the observability profile (collector, Loki, Tempo, Mimir, Grafana) and wait for health"
run = '''
set -e
docker compose --profile observability up -d --wait --build otel-collector loki tempo mimir grafana
for i in $(seq 1 30); do
  curl -sf "http://127.0.0.1:${MIMIR_PORT:-9009}/prometheus/api/v1/query?query=vector(1)" >/dev/null && exit 0
  sleep 1
done
echo "mimir did not become queryable within 30s" >&2
exit 1
'''

# `down` is project-wide by default; naming the five services here keeps it
# from also stopping the postgres db:up started.
[tasks."otel:down"]
description = "Stop the observability profile (keep data)"
run = "docker compose --profile observability down otel-collector loki tempo mimir grafana"

[tasks."otel:reset"]
description = "Stop the observability profile and drop its data"
run = "docker compose --profile observability down -v otel-collector loki tempo mimir grafana"

# The whole local stack, PostgreSQL and Azurite and the observability profile together.
# Neither half depends on the other, so mise runs each pair in parallel.
[tasks."stack:up"]
description = "Build and start PostgreSQL and Azurite and the observability profile and wait for health"
depends = ["db:up", "otel:up"]

[tasks."stack:down"]
description = "Stop PostgreSQL and Azurite and the observability profile (keep data)"
depends = ["db:down", "otel:down"]

[tasks."stack:reset"]
description = "Stop PostgreSQL and Azurite and the observability profile and drop their data"
depends = ["db:reset", "otel:reset"]

# The running service does the work through its admin mount, confirmed as it
# requires: every migration set reverted, the sets applied, the named state
# seeded.
[tasks."db:state"]
description = "Reset the running service's database to a named state"
usage = 'arg "<state>" help="The state to reset to, one of GET /admin/database/states"'
run = 'curl -sS --fail-with-body -H "Content-Type: application/json" -d "{\"state\":\"$usage_state\",\"confirm\":true}" http://127.0.0.1:8080/admin/database/state && echo'
