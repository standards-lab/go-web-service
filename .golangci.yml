# golangci-lint v2 configuration, run per module by `mise run check`.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused),
  # plus testpackage, which keeps tests black-box. Its skip regexp is
  # narrowed to export_test.go: tests live in <pkg>_test and drive the
  # exported API, and the one white-box file allowed is export_test.go,
  # which only exports a clock or probe hook the API cannot reach.
  default: standard
  enable:
    - testpackage
  settings:
    testpackage:
      skip-regexp: export_test\.go
  exclusions:
    rules:
      # Pending the architect's decision on the escalation that keeps this
      # file white-box.
      - path: ^internal/app/admin_internal_test\.go
        linters:
          - testpackage
      # Pending the architect's decision: slab's duplicate-scenario panic is
      # reachable only through the unexported commands, since Commands
      # builds over the fixed Scenarios list.
      - path: demo/commands_internal_test\.go
        linters:
          - testpackage
