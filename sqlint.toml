# sqlint: the module's SQL conventions, run by `mise run check`.
# See docs/stack.md

engine = "github.com/standards-lab/sqlate/postgres"

[sources]
sql = "github.com/standards-lab/sqlate"
blobfs = "github.com/standards-lab/blobfs"
app = "data/patterns"

[statements]
dirs = ["domain/*/statements", "data/statements"]
verb_named = true
delimiter = true
native_forms = true

[patterns]
dirs = ["data/patterns"]
delimiter = true
native_forms = true

[migrations]
dirs = ["data/migrations"]
single_statement = true
