# Mimir as a single binary on local storage.
# See compose/README.md

multitenancy_enabled: false

server:
  http_listen_port: 9009

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory
    min_ready_duration: 0s

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager

alertmanager:
  data_dir: /data/alertmanager-data

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
