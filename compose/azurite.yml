services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # azblob v1.8.1 sends an x-ms-version newer than the image accepts by
    # default, so the version check is off.
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck -l /data
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - go-web-service-azurite:/data
    healthcheck:
      # The image defines no health check; its busybox nc shows the blob
      # listener accepts connections.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  go-web-service-azurite:
