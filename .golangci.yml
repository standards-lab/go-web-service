# golangci-lint v2 configuration, run per module by `mise run check`: the standard set plus
# testpackage and nolintlint.
# See docs/tests.md
# See architecture/principles/comments.md
version: "2"

linters:
  default: standard
  enable:
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
