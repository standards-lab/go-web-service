name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: go vet
        run: go vet -tags integration ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

      - name: go mod tidy -diff
        run: go mod tidy -diff

      - name: go test -race
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags integration

      - name: sqlint
        run: go tool sqlint

  # The integration tier: the composed service, black-box, against the same
  # compose definition a developer runs, as its own project. On merge to main
  # and on demand, below the per-PR unit rate by design; a release is cut only
  # from a main whose run has passed. The task tears the stack down itself.
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: go-web-service-integration
      POSTGRES_PORT: "5433"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: docker compose up
        run: docker compose up -d --wait

      - name: go test -tags integration
        run: APP_DATABASE_PORT=5433 go test -race -count=1 -tags integration ./integration/

      - name: docker compose logs
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v
