name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: mise run check
        run: mise run check

  # The integration tier: the composed service, black-box, against the same
  # compose definition a developer runs, as its own project. On merge to main
  # and on demand, below the per-PR unit rate by design; a release is cut only
  # from a main whose run has passed. The task tears the stack down itself.
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: go-web-service-integration
      POSTGRES_PORT: "5433"
      AZURITE_BLOB_PORT: "10001"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"

      - name: docker compose up
        run: docker compose up -d --wait

      - name: go test -tags integration
        run: APP_DATABASE_PORT=5433 APP_STORAGE_ENDPOINT=http://127.0.0.1:10001/devstoreaccount1 go test -race -count=1 -tags integration ./integration/

      - name: docker compose logs
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v
