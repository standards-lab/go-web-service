[tools]
go = "1.27"
golangci-lint = "2.13.2"

[env]
APP_ENV = "local"

[tasks.vet]
description = "Run go vet, the integration suite included"
run = "go vet -tags integration ./..."

# Start the observability profile first (`mise run otel-up`): the task opens a
# TCP connection to the collector's log port before it builds anything and
# exits when nothing answers. tee then copies every stdout line to the terminal
# and to that socket. If the collector goes away while the service runs, the
# chain breaks on a later log write and SIGPIPE kills the service, so restart
# the profile only while serve is stopped. The shell is bash, not sh, because
# /dev/tcp is a bash pseudo-device.
[tasks.serve]
description = "Run the service locally, streaming its logs to the observability collector"
shell = "bash -c"
run = '''
exec 3>/dev/tcp/127.0.0.1/${OTEL_LOG_PORT:-4319} || exit
go run ./cmd/server | tee >(cat >&3)
'''

[tasks.test]
description = "Run the unit tier"
run = "go test -race ./..."

# The integration tier runs the same compose definition as its own project on
# its own port, so the developer's stack and data are never touched, and tears
# it down with its volume when the suite ends, pass or fail.
[tasks.integration]
description = "Start an isolated compose stack, run the integration tier against it, and tear it down"
run = '''
set -e
export COMPOSE_PROJECT_NAME=go-web-service-integration POSTGRES_PORT=5433
trap 'docker compose down -v' EXIT
docker compose up -d --wait
APP_DATABASE_PORT=5433 go test -race -count=1 -tags integration ./integration/
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint, the integration suite included, then sqlint over the SQL files"
run = "golangci-lint run --build-tags integration ./... && go tool sqlint"

# services
[tasks.db-up]
description = "Start the local postgres and wait for health"
run = "docker compose up -d --wait"

[tasks.db-down]
description = "Stop the local postgres (keep data)"
run = "docker compose down"

[tasks.db-reset]
description = "Stop the local postgres and drop its data"
run = "docker compose down -v"

[tasks.otel-up]
description = "Start the observability profile (collector, Loki, Tempo, Mimir, Grafana) and wait for health"
run = "docker compose --profile observability up -d --wait"

# `down` is project-wide by default; naming the five services here keeps it
# from also stopping the postgres db-up started.
[tasks.otel-down]
description = "Stop the observability profile (keep data)"
run = "docker compose --profile observability down otel-collector loki tempo mimir grafana"

[tasks.otel-reset]
description = "Stop the observability profile and drop its data"
run = "docker compose --profile observability down -v otel-collector loki tempo mimir grafana"

# The running service does the work through its admin mount: every applied
# migration reverted, the set applied, the named state's set seeded.
[tasks.db-state]
description = "Reset the running service's database to a named state"
usage = 'arg "<state>" help="The state to reset to, one of GET /admin/database/states"'
run = 'curl -sS --fail-with-body -H "Content-Type: application/json" -d "{\"state\":\"$usage_state\"}" http://127.0.0.1:8080/admin/database/state && echo'

